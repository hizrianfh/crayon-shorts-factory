name: render-and-publish

on:
  push:
    branches: [main]
    paths: [current/story.mjs]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after rendering
        type: boolean
        default: true

concurrency:
  group: render-and-publish
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy
      - run: node render.mjs video
      - run: python3 current/audio.py
      - run: python3 mix.py "$(ls current/voice.wav current/voice.mp3 2>/dev/null | head -1)" music.wav sfx.wav
      - run: bash finish.sh final
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: out/final.mp4
          retention-days: 14
      - if: github.event_name == 'push' || inputs.publish
        run: python3 publish.py
        env:
          PUBLISHER_API_KEY: ${{ secrets.PUBLISHER_API_KEY }}
          PUBLISHER_PROVIDER: ${{ vars.PUBLISHER_PROVIDER }}
          VIDEO: out/final.mp4
